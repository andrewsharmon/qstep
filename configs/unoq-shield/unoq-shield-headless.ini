# QStep: Arduino UNO Q + CNC Shield v3, X/Y/Z on unoq_spi joints 0..2.
# DRV8825 at 1/32 microstepping, 200-step motors: 6400 steps/rev.
# Units are motor REVOLUTIONS until the mechanics are known; then set
# SCALE = steps per rev / (mm per rev) and the limits/speeds in mm.
# Other drivers or jumper settings: SCALE = 200 x microstepping, e.g. 3200
# for 1/16 (a standalone TMC2208 with MS1+MS2 fitted).
[EMC]
VERSION = 1.1
MACHINE = QStep UNO Q
DEBUG = 0

[DISPLAY]
# AXIS on the board's virtual display :1, viewed over VNC (see board/qstep-vnc.service).
# unoq-shield-headless.ini is the same machine with no GUI, for scripted tests.
DISPLAY = ./headless-display
CYCLE_TIME = 0.100
PROGRAM_PREFIX = /home/arduino/qstep-config/nc_files
INCREMENTS = 1, 0.1, 0.01, 0.001
DEFAULT_LINEAR_VELOCITY = 2
MAX_LINEAR_VELOCITY = 5
GEOMETRY = XYZ
POSITION_OFFSET = RELATIVE
POSITION_FEEDBACK = ACTUAL
MAX_FEED_OVERRIDE = 1.2

[TASK]
TASK = milltask
CYCLE_TIME = 0.001

[RS274NGC]
PARAMETER_FILE = linuxcnc.var

[EMCMOT]
EMCMOT = motmod
COMM_TIMEOUT = 1.0
SERVO_PERIOD = 1000000

[EMCIO]
EMCIO = io
CYCLE_TIME = 0.100
TOOL_TABLE = tool.tbl

[HAL]
HALFILE = unoq-shield.hal

[KINS]
KINEMATICS = trivkins coordinates=XYZ
JOINTS = 3

[TRAJ]
COORDINATES = X Y Z
LINEAR_UNITS = mm
ANGULAR_UNITS = degree
DEFAULT_LINEAR_VELOCITY = 2
MAX_LINEAR_VELOCITY = 5
DEFAULT_LINEAR_ACCELERATION = 20
MAX_LINEAR_ACCELERATION = 20

[AXIS_X]
MAX_VELOCITY = 5
MAX_ACCELERATION = 20
MIN_LIMIT = -1000
MAX_LIMIT = 1000

[AXIS_Y]
MAX_VELOCITY = 5
MAX_ACCELERATION = 20
MIN_LIMIT = -1000
MAX_LIMIT = 1000

[AXIS_Z]
MAX_VELOCITY = 5
MAX_ACCELERATION = 20
MIN_LIMIT = -1000
MAX_LIMIT = 1000

[JOINT_0]
TYPE = LINEAR
SCALE = 6400
MAX_VELOCITY = 5
MAX_ACCELERATION = 20
# Stepgen needs headroom over the trajectory limits (StepConf uses 1.25x)
STEPGEN_MAXVEL = 6.25
STEPGEN_MAXACCEL = 25
FERROR = 0.05
MIN_FERROR = 0.01
MIN_LIMIT = -1000
MAX_LIMIT = 1000
HOME = 0
HOME_SEARCH_VEL = 0
HOME_SEQUENCE = 0

[JOINT_1]
TYPE = LINEAR
SCALE = 6400
MAX_VELOCITY = 5
MAX_ACCELERATION = 20
# Stepgen needs headroom over the trajectory limits (StepConf uses 1.25x)
STEPGEN_MAXVEL = 6.25
STEPGEN_MAXACCEL = 25
FERROR = 0.05
MIN_FERROR = 0.01
MIN_LIMIT = -1000
MAX_LIMIT = 1000
HOME = 0
HOME_SEARCH_VEL = 0
HOME_SEQUENCE = 0

[JOINT_2]
TYPE = LINEAR
SCALE = 6400
MAX_VELOCITY = 5
MAX_ACCELERATION = 20
# Stepgen needs headroom over the trajectory limits (StepConf uses 1.25x)
STEPGEN_MAXVEL = 6.25
STEPGEN_MAXACCEL = 25
FERROR = 0.05
MIN_FERROR = 0.01
MIN_LIMIT = -1000
MAX_LIMIT = 1000
HOME = 0
HOME_SEARCH_VEL = 0
HOME_SEQUENCE = 0
