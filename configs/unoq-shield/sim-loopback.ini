# ArduCNC: Arduino UNO Q + CNC Shield v3 (DRV8825), X/Y/Z on unoq_spi joints 0..2.
# Units are raw motor steps until the real steps/mm is known (SCALE = 1).
[EMC]
VERSION = 1.1
MACHINE = ArduCNC UNO Q
DEBUG = 0

[DISPLAY]
# Headless for bring-up; swap for "axis" once a monitor is attached.
DISPLAY = ./headless-display
POSITION_OFFSET = RELATIVE
POSITION_FEEDBACK = ACTUAL
MAX_FEED_OVERRIDE = 1.2

[TASK]
TASK = milltask
CYCLE_TIME = 0.001

[RS274NGC]
PARAMETER_FILE = linuxcnc.var

[EMCMOT]
EMCMOT = motmod
COMM_TIMEOUT = 1.0
SERVO_PERIOD = 1000000

[EMCIO]
EMCIO = io
CYCLE_TIME = 0.100
TOOL_TABLE = tool.tbl

[HAL]
HALFILE = sim-loopback.hal

[KINS]
KINEMATICS = trivkins coordinates=XYZ
JOINTS = 3

[TRAJ]
COORDINATES = X Y Z
LINEAR_UNITS = mm
ANGULAR_UNITS = degree
DEFAULT_LINEAR_VELOCITY = 500
MAX_LINEAR_VELOCITY = 1000
DEFAULT_LINEAR_ACCELERATION = 4000
MAX_LINEAR_ACCELERATION = 4000

[AXIS_X]
MAX_VELOCITY = 1000
MAX_ACCELERATION = 4000
MIN_LIMIT = -100000
MAX_LIMIT = 100000

[AXIS_Y]
MAX_VELOCITY = 1000
MAX_ACCELERATION = 4000
MIN_LIMIT = -100000
MAX_LIMIT = 100000

[AXIS_Z]
MAX_VELOCITY = 1000
MAX_ACCELERATION = 4000
MIN_LIMIT = -100000
MAX_LIMIT = 100000

[JOINT_0]
TYPE = LINEAR
SCALE = 1
MAX_VELOCITY = 1000
MAX_ACCELERATION = 4000
FERROR = 50
MIN_FERROR = 10
MIN_LIMIT = -100000
MAX_LIMIT = 100000
HOME = 0
HOME_SEARCH_VEL = 0
HOME_SEQUENCE = 0

[JOINT_1]
TYPE = LINEAR
SCALE = 1
MAX_VELOCITY = 1000
MAX_ACCELERATION = 4000
FERROR = 50
MIN_FERROR = 10
MIN_LIMIT = -100000
MAX_LIMIT = 100000
HOME = 0
HOME_SEARCH_VEL = 0
HOME_SEQUENCE = 0

[JOINT_2]
TYPE = LINEAR
SCALE = 1
MAX_VELOCITY = 1000
MAX_ACCELERATION = 4000
FERROR = 50
MIN_FERROR = 10
MIN_LIMIT = -100000
MAX_LIMIT = 100000
HOME = 0
HOME_SEARCH_VEL = 0
HOME_SEQUENCE = 0
